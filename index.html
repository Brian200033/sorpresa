<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0c10;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            color: #333;
        }

        /* GIF Oculto de fondo */
        .bg-gif-fijo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('https://i.pinimg.com/originals/e8/3b/68/e83b683d78c0e25b0429f93930b8d522.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            z-index: 1;
            pointer-events: none;
        }

        /* Contenedor principal del Sobre */
        .envelope-wrapper {
            position: relative;
            z-index: 10;
            cursor: pointer;
            perspective: 1000px;
        }

        .envelope {
            position: relative;
            width: 320px;
            height: 220px;
            background-color: #b02a2a;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.5s ease;
        }

        .envelope-inner {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 4px;
        }

        /* Solapa superior */
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 115px solid #d32f2f;
            transform-origin: top;
            transition: transform 0.6s ease, z-index 0.2s;
            z-index: 5;
        }

        /* Lados del sobre */
        .pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid #9a2222;
            border-right: 160px solid #9a2222;
            border-bottom: 110px solid #b02a2a;
            z-index: 4;
        }

        /* Sello postal / Frente del sobre */
        .envelope-front {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 6;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            pointer-events: none;
        }

        .stamp {
            width: 50px;
            height: 60px;
            align-self: flex-end;
            border: 2px dashed #fff;
            object-fit: cover;
        }

        .envelope-text {
            color: #ffffff;
            font-size: 1.1rem;
            font-style: italic;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* Carta dentro del sobre */
        .letter {
            position: absolute;
            bottom: 10px;
            left: 15px;
            width: 290px;
            height: 190px;
            background: #fffdf8;
            border-radius: 4px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: transform 0.8s ease-in-out, opacity 0.5s ease;
            z-index: 3;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .letter h2 {
            font-size: 1.2rem;
            color: #b02a2a;
            margin-bottom: 8px;
        }

        .letter p {
            font-size: 0.85rem;
            line-height: 1.3;
            color: #444;
        }

        /* Animación al abrir */
        .envelope-wrapper.open .flap {
            transform: rotateX(180deg);
            z-index: 2;
        }

        .envelope-wrapper.open .letter {
            transform: translateY(-130px) scale(1.05);
            z-index: 7;
            height: auto;
            max-height: 280px;
        }

        .envelope-wrapper.open .envelope-front {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .envelope-wrapper.open .bg-gif-fijo {
            opacity: 0.85;
        }

        /* --- Estilos CSS de la Nieve --- */
        .snowflake {
            position: fixed;
            top: -10px;
            color: #fff;
            user-select: none;
            z-index: 9999;
            pointer-events: none;
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0.2;
            }
        }
    </style>
</head>
<body>

    <div class="bg-gif-fijo" id="bgGif"></div>

    <!-- Audio Oculto -->
    <audio id="audioCarta" loop preload="auto">
        <source src="https://github.com/Brian200033/sorpresa/raw/refs/heads/main/Ice%20Dance.m4a.mp4" type="audio/mp4">
    </audio>

    <!-- Sobre interactivo -->
    <div class="envelope-wrapper" id="envelopeWrapper">
        <div class="envelope">
            <div class="flap"></div>
            <div class="envelope-inner">
                <div class="pocket"></div>
                <div class="letter">
                    <h2>Para Ti ❤️</h2>
                    <p>
                        Esta es una sorpresa especial para ti. <br><br>
                        Gracias por estar presente y hacer cada día algo único. 
                        Espero que este pequeño detalle te saque una sonrisa. ✨
                    </p>
                </div>
            </div>
            <div class="envelope-front">
                <img src="https://i.pinimg.com/736x/d2/4e/56/d24e56948e00b8a3193dd810a61526a1.jpg" class="stamp" alt="sello">
                <div class="envelope-text">
                    <p><b>Para:</b> Ti ❤️</p>
                    <p style="font-size: 0.8rem; opacity: 0.8;">(Haz clic para abrir)</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Script para abrir sobre, reproducir audio y generar nieve -->
    <script>
        const wrapper = document.getElementById('envelopeWrapper');
        const bgGif = document.getElementById('bgGif');
        const audio = document.getElementById('audioCarta');

        wrapper.addEventListener('click', () => {
            wrapper.classList.toggle('open');

            if (wrapper.classList.contains('open')) {
                bgGif.style.opacity = '0.85';
                audio.play().catch(error => {
                    console.log("El navegador bloqueó el auto-play hasta otra interacción:", error);
                });
            } else {
                bgGif.style.opacity = '0';
                audio.pause();
            }
        });

        // Función para crear copos de nieve
        function createSnowflake() {
            const flake = document.createElement('div');
            flake.classList.add('snowflake');
            flake.innerHTML = '❄';
            
            flake.style.left = Math.random() * 100 + 'vw';
            flake.style.fontSize = (Math.random() * 12 + 10) + 'px';
            flake.style.opacity = Math.random() * 0.7 + 0.3;
            
            const duration = Math.random() * 5 + 3;
            flake.style.animationDuration = duration + 's';
            
            document.body.appendChild(flake);
            
            setTimeout(() => {
                flake.remove();
            }, duration * 1000);
        }

        setInterval(createSnowflake, 200);
    </script>
</body>
</html>
